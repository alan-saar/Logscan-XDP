# Papel: O Laboratório de Testes
# O que faz: Descreve a topologia de rede isolada usada para validação científica.
# Levanta dois nós: O Nó Vítima (onde o eBPF e a IA rodam) e o Nó Atacante/Gerador
# (que fará o replay dos logs do dataset HDFS).

name: logscan-lab
topology:
  nodes:
    # Nó onde roda o Logscan (Kernel + IA)
    victim_server:
      kind: linux
      image: ubuntu:24.04
      binds:
        - /lib/modules:/lib/modules:ro
        - ../../:/app
      exec:
        - apt-get update
        - apt-get install -y iproute2 python3 python3-pip linux-tools-common linux-tools-generic
        - sh -c "ln -sf /usr/lib/linux-tools/*/bpftool /usr/bin/bpftool"
        - sh -c "ln -sf /usr/lib/linux-tools/*/bpftool /usr/sbin/bpftool"
        - ip addr add 10.10.10.1/24 dev eth1
        - ip link set eth1 up

    # Nó que injeta o tráfego pesado / Replay
    traffic_generator:
      kind: linux
      image: ubuntu:24.04
      binds:
        - ../../:/app
      exec:
        - apt-get update
        - apt-get install -y iproute2 python3
        - ip addr add 10.10.10.2/24 dev eth1
        - ip link set eth1 up

  links:
    - endpoints: ["victim_server:eth1", "traffic_generator:eth1"]
