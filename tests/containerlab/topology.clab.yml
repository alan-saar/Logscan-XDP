name: logscan

topology:
  nodes:
    attacker:
      kind: linux
      image: nicolaka/netshoot
      exec:
        - ip addr add 192.168.10.2/24 dev eth1
        - ip link set eth1 up
    server:
      kind: linux
      image: nicolaka/netshoot
      exec:
        - ip addr add 192.168.10.3/24 dev eth1
        - ip link set eth1 up

  links:
    - endpoints: [ "attacker:eth1", "server:eth1" ]
